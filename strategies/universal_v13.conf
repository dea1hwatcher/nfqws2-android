IFACE_EXCLUDE="lo tun+ tap+ wg+ awg+ vpn+ warp+ ppp+ ipsec+ tailscale+ ifb+ dummy+"
ISP_INTERFACE=""

NFQWS_BASE_ARGS="--lua-init=@$LUA_DIR/zapret-lib.lua 
--lua-init=@$LUA_DIR/zapret-antidpi.lua 
--lua-init=@$LUA_DIR/zapret-auto.lua 
--lua-init=@$LUA_DIR/custom_funcs.lua 
--blob=tls_google:@$BLOBS_DIR/tls_clienthello_www_google_com.bin 
--blob=tls_4pda:@$BLOBS_DIR/tls_clienthello_4pda_to.bin 
--blob=quic_google:@$BLOBS_DIR/quic_initial_www_google_com.bin 
--blob=discord_udp:@$BLOBS_DIR/quic_initial_steamcommunity_com.bin"

# General HTTP(S) desync pipeline (V12 base)
NFQWS_ARGS="--filter-tcp=80,443 --filter-l7=http,tls 
--payload=tls_client_hello 
--lua-desync=fake:blob=tls_google:ip_autottl=-1,3-20:ip6_autottl=-1,3-20:repeats=6:tcp_ack=-66000 
--lua-desync=multidisorder:pos=1,host+2,sld+2,sld+5,sniext+1,sniext+2,endhost-2 
--payload=http_req 
--lua-desync=fake:blob=tls_google:ip_autottl=-1,3-20:repeats=6:tcp_ack=-66000 
--lua-desync=multisplit:pos=1:seqovl=568:seqovl_pattern=tls_4pda"

NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic 
--payload=quic_initial 
--lua-desync=fake:blob=quic_google:ip_autottl=-2,3-20:ip6_autottl=-2,3-20:repeats=8"

NFQWS_ARGS_UDP="--filter-udp=3478-3481,19294-19344,50000-65535 --filter-l7=discord,stun 
--payload=discord_ip_discovery,stun 
--lua-desync=fake:blob=discord_udp:repeats=6 
--lua-desync=udplen:increment=2:min=64"

MODE_LIST="--hostlist=$LISTS_DIR/user.list"
MODE_ALL="--hostlist-exclude=$LISTS_DIR/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=$LISTS_DIR/auto.list --hostlist-auto-debug=$LOG_DIR/auto.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_AUTO"
NFQWS_ARGS_IPSET="--ipset=$LISTS_DIR/ipset.list --ipset-exclude=$LISTS_DIR/ipset_exclude.list"

# V13 (10.11): Twitter/X Cloudflare fix — isolated seqovl-4pda desync without multidisorder
NFQWS_ARGS_CUSTOM="--filter-tcp=80,443 --filter-l7=tls 
--hostlist-domains=x.com,t.co,twimg.com,twitter.com,abs.twimg.com,pbs.twimg.com,video.twimg.com,api.x.com 
--out-range=-d8 
--payload=tls_client_hello 
--lua-desync=multisplit:pos=1:seqovl=568:seqovl_pattern=tls_4pda 
--new 
--filter-tcp=80,443 --filter-l7=tls 
--ipset=$LISTS_DIR/ipset_twitter.list 
--out-range=-d8 
--payload=tls_client_hello 
--lua-desync=multisplit:pos=1:seqovl=568:seqovl_pattern=tls_4pda"

IPV6_ENABLED=1
TCP_PORTS=80,443,1984,2053,2083,2087,2096,5222,8443
UDP_PORTS=443,590:600,1400,3478:3481,5349,19294:19344,49152:65535
NFQUEUE_NUM=300

PKT_LIMIT_OUT=15
PKT_LIMIT_IN=15

BLOCK_QUIC=0
NAT_FIX=1
APP_MODE=off
AUTOSTART=1
WATCHDOG=1

NFQWS_USER=root
LOG_LEVEL=0
LOG_MAX_KB=512
