IFACE_EXCLUDE="lo tun+ tap+ wg+ awg+ vpn+ warp+ ppp+ ipsec+ tailscale+ ifb+ dummy+"
ISP_INTERFACE=""

NFQWS_BASE_ARGS="--lua-init=@$LUA_DIR/zapret-lib.lua
                 --lua-init=@$LUA_DIR/zapret-antidpi.lua
                 --lua-init=@$LUA_DIR/zapret-custom.lua
                 --lua-gc=60
                 --blob=google_tls:@$BLOBS_DIR/tls_clienthello_www_google_com.bin
                 --blob=tls_max:@$BLOBS_DIR/tls_clienthello_max_ru.bin
                 --blob=quic_google:@$BLOBS_DIR/quic_initial_www_google_com.bin
                 --blob=discord_udp:@$BLOBS_DIR/discord_udp.bin"

# zapret4rocket: GoogleVideo 7-marker multidisorder + General TLS multisplit BadSeq 1000000
NFQWS_ARGS="--filter-tcp=80,443 --filter-l7=http,tls
            --payload=tls_client_hello
            --hostlist-domains=youtube.com,googlevideo.com,google.com,ytimg.com,ggpht.com,googleapis.com
            --out-range=-d10
            --lua-desync=fake:blob=google_tls:repeats=6:fooling=badsum
            --lua-desync=multidisorder:pos=2,5,105,host+5,sld-1,endsld-5,endsld
            --new
            --filter-tcp=80,443 --filter-l7=tls
            --payload=tls_client_hello
            --out-range=-d10
            --lua-desync=fake:blob=tls_max:repeats=6:fooling=badsum
            --lua-desync=multisplit:pos=1:fooling=tcp_seq=1000000
            --new
            --filter-tcp=80 --filter-l7=http
            --payload=http_req
            --out-range=-d10
            --lua-desync=fake:blob=google_tls:repeats=4:fooling=badsum
            --lua-desync=multidisorder:pos=1,midsld"

NFQWS_ARGS_QUIC="--filter-udp=443 --filter-l7=quic
                 --payload=quic_initial
                 --out-range=-d10
                 --lua-desync=fake:blob=quic_google:repeats=3:ipfrag:ipfrag_pos_udp=8
                 --lua-desync=udplen:increment=8:pattern=0xFEA82025"

NFQWS_ARGS_UDP="--filter-udp=3478-3481,19294-19344,50000-65535 --filter-l7=discord,stun
                --payload=discord_ip_discovery,stun
                --out-range=-d10
                --lua-desync=fake:blob=discord_udp:repeats=6"

MODE_LIST="--hostlist=$LISTS_DIR/user.list"
MODE_ALL="--hostlist-exclude=$LISTS_DIR/exclude.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=$LISTS_DIR/auto.list --hostlist-auto-debug=$LOG_DIR/auto.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_AUTO"
NFQWS_ARGS_IPSET="--ipset=$LISTS_DIR/ipset.list --ipset-exclude=$LISTS_DIR/ipset_exclude.list"

# Dedicated profiles for Discord media, Discord TLS, and WARP
NFQWS_ARGS_CUSTOM="--filter-tcp=2053,2083,2087,2096,8443 --filter-l7=tls
                   --out-range=-d10
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=tls_max:repeats=6:fooling=tcp_ts=-600000,badsum
                   --lua-desync=multisplit:pos=1:fooling=tcp_seq=1000000
                   --new
                   --filter-tcp=443 --filter-l7=tls
                   --ipset=$LISTS_DIR/ipset_discord.list
                   --out-range=-d10
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=tls_max:repeats=6:fooling=badsum
                   --lua-desync=multidisorder:pos=1,midsld
                   --new
                   --filter-udp=443,500,1701,2408,4443,4500,8095,8443
                   --ipset=$LISTS_DIR/ipset_warp.list
                   --out-range=-d6
                   --lua-desync=fake:blob=quic_google:payload=all:repeats=1"

IPV6_ENABLED=1
TCP_PORTS=80,443,1984,2053,2083,2087,2096,5222,8443
UDP_PORTS=443,500,590:600,1400,1701,2408,3478:3481,4443,4500,5349,8095,8443,19294:19344,49152:65535
NFQUEUE_NUM=300

PKT_LIMIT_OUT=15
PKT_LIMIT_IN=15

BLOCK_QUIC=0
NAT_FIX=1
APP_MODE=off
