# =============================================================================
# general (CIRCULAR).bat -> NFQWS2 / zapret2-discord-youtube-strats
# circular + fake + hostfakesplit + http_domcase + http_hostcase; seqovl=661, strategy=N, tls_mod
# Порт: https://github.com/kinlay0/zapret2-discord-youtube-strats (remote strats).
# Lua-движок zapret2 у нас идентичен (zapret-lib/antidpi/auto совпадают побайтово),
# поэтому desync-техники и значения tcp_ts перенесены как есть. Переведены имена
# блобов, списки, --wf-tcp/udp -> TCP_PORTS/UDP_PORTS и разбиение .bat-профилей
# по секциям nfqws2.conf.
# Game Filter выключен — его фрагменты в game-profiles/circular.args
# =============================================================================

# Provider network interface
ISP_INTERFACE=""

# Startup arguments
NFQWS_BASE_ARGS="                 --lua-init=@$LUA_DIR/zapret-lib.lua
                 --lua-init=@$LUA_DIR/zapret-antidpi.lua
                 --lua-init=@$LUA_DIR/zapret-auto.lua
                 --blob=quic_initial_4pda_to:@$BLOBS_DIR/quic_initial_4pda_to.bin
                 --blob=quic_initial_rutube_ru:@$BLOBS_DIR/quic_initial_rutube_ru.bin
                 --blob=quic_initial_steamcommunity_com:@$BLOBS_DIR/quic_initial_steamcommunity_com.bin
                 --blob=tls_clienthello_4pda_to:@$BLOBS_DIR/tls_clienthello_4pda_to.bin
                 --blob=tls_clienthello_sochi_park:@$BLOBS_DIR/tls_clienthello_sochi_park.bin
                 --blob=tls_clienthello_steam_chat_com_full:@$BLOBS_DIR/tls_clienthello_steam_chat_com_full.bin
                 --blob=tls_clienthello_www_google_com:@$BLOBS_DIR/tls_clienthello_www_google_com.bin
                 --blob=tls_clienthello_www_sferum_ru:@$BLOBS_DIR/tls_clienthello_www_sferum_ru.bin"

# HTTP(S) strategy
NFQWS_ARGS="            --filter-tcp=80,443
            --filter-l7=http,tls
            --in-range=-s34228
            --out-range=-s34228
            --payload=all
            --lua-desync=circular:key=gen:nld=2:fails=2:time=120:retrans=2:reset
            --payload=tls_client_hello
            --lua-desync=tls_client_hello_clone:blob=ch_clone:fallback=tls_google:sni_del:sni_first=www.google.com:sni_snt_new=0:strategy=1
            --lua-desync=fake:blob=ch_clone:repeats=6:tcp_ts=-600000:ip_id=zero:strategy=1
            --lua-desync=fake:blob=tls_clienthello_www_google_com:tls_mod=rnd,padencap:repeats=4:badsum:ip_id=zero:strategy=1
            --lua-desync=multisplit:pos=sniext+1,midsld:seqovl=1:ip_id=zero:strategy=1
            --lua-desync=fake:blob=tls_clienthello_www_google_com:tls_mod=rnd,dupsid:repeats=6:tcp_ts=-600000:ip_id=zero:strategy=2
            --lua-desync=multidisorder:pos=1,midsld:ip_id=zero:strategy=2
            --payload=http_req
            --lua-desync=fake:blob=tls_clienthello_steam_chat_com_full:repeats=8:tcp_ts=-600000:strategy=1
            --lua-desync=multisplit:pos=2:strategy=1
            --lua-desync=hostfakesplit:host=rutube.ru:repeats=4:tcp_ts=-600000:strategy=2"

# QUIC strategy
NFQWS_ARGS_QUIC="                 --filter-udp=443
                 --filter-l7=quic
                 --hostlist=$LISTS_DIR/google.list
                 --payload=quic_initial
                 --lua-desync=fake:blob=quic_initial_rutube_ru:repeats=6"

# UDP strategy — Discord voice / STUN
NFQWS_ARGS_UDP="                --filter-udp=19294-19344,50000-50100
                --filter-l7=discord,stun
                --payload=discord_ip_discovery,stun
                --lua-desync=fake:blob=quic_initial_steamcommunity_com:repeats=6"

# Working modes
MODE_LIST="--hostlist=$LISTS_DIR/user.list
           --hostlist=$LISTS_DIR/rkn.list
           --hostlist=$LISTS_DIR/user-extra.list
           --hostlist-exclude=$LISTS_DIR/exclude.list
           --hostlist-exclude=$LISTS_DIR/exclude-extra.list
           --ipset-exclude=$LISTS_DIR/ipset_exclude.list
           --ipset-exclude=$LISTS_DIR/ipset_exclude-extra.list"
MODE_ALL="--hostlist-exclude=$LISTS_DIR/exclude.list
          --hostlist-exclude=$LISTS_DIR/exclude-extra.list
          --ipset-exclude=$LISTS_DIR/ipset_exclude.list
          --ipset-exclude=$LISTS_DIR/ipset_exclude-extra.list"
MODE_AUTO="$MODE_LIST --hostlist-auto=$LISTS_DIR/auto.list --hostlist-auto-debug=$LOG_DIR/nfqws2.log $MODE_ALL"
NFQWS_EXTRA_ARGS="$MODE_LIST"

# IP-lists
# Точные IP-профили находятся в CUSTOM: у них отдельные порты.
# Автокопирование основной стратегии выключено.
NFQWS_ARGS_IPSET=""

# Custom arguments — служба ставит их раньше UDP / QUIC / HTTPS.
# Discord media, YouTube, IP-профили.
NFQWS_ARGS_CUSTOM="                   --filter-tcp=2053,2083,2087,2096,8443
                   --hostlist-domains=discord.media
                   --in-range=-s34228
                   --out-range=-s34228
                   --payload=all
                   --lua-desync=circular:key=dm:fails=2:time=120:retrans=2:reset
                   --payload=tls_client_hello
                   --lua-desync=tls_client_hello_clone:blob=ch_clone:fallback=tls_google:sni_del:sni_first=www.google.com:sni_snt_new=0:strategy=1
                   --lua-desync=fake:blob=ch_clone:repeats=6:tcp_ts=-600000:ip_id=zero:strategy=1
                   --lua-desync=fake:blob=tls_clienthello_www_google_com:tls_mod=rnd,padencap:repeats=4:badsum:ip_id=zero:strategy=1
                   --lua-desync=multisplit:pos=sniext+1,midsld:seqovl=1:ip_id=zero:strategy=1
                   --lua-desync=fake:blob=tls_clienthello_www_google_com:tls_mod=rnd,dupsid:repeats=6:tcp_ts=-600000:ip_id=zero:strategy=2
                   --lua-desync=multidisorder:pos=1,midsld:ip_id=zero:strategy=2
                   --new
                   --filter-tcp=443
                   --hostlist=$LISTS_DIR/google.list
                   --in-range=-s34228
                   --out-range=-s34228
                   --payload=all
                   --lua-desync=circular:key=yt:nld=2:fails=2:time=120:retrans=2:reset
                   --payload=tls_client_hello
                   --lua-desync=tls_client_hello_clone:blob=ch_clone:fallback=tls_steamchat:sni_del:sni_first=winelab.ru:sni_snt_new=0:strategy=1
                   --lua-desync=fake:blob=ch_clone:repeats=6:tcp_ts=-600000:strategy=1
                   --lua-desync=fake:blob=tls_clienthello_steam_chat_com_full:tls_mod=rnd,padencap:repeats=4:badsum:strategy=1
                   --lua-desync=multisplit:pos=sniext+1,midsld:seqovl=1:strategy=1
                   --lua-desync=fake:blob=tls_clienthello_www_sferum_ru:repeats=6:tcp_ts=-600000:strategy=2
                   --lua-desync=multisplit:pos=2:ip_id=zero:strategy=2
                   --new
                   --filter-udp=443
                   --ipset=$LISTS_DIR/ipset.list
                   --hostlist-exclude=$LISTS_DIR/exclude.list
                   --hostlist-exclude=$LISTS_DIR/exclude-extra.list
                   --ipset-exclude=$LISTS_DIR/ipset_exclude.list
                   --ipset-exclude=$LISTS_DIR/ipset_exclude-extra.list
                   --payload=quic_initial
                   --lua-desync=fake:blob=quic_initial_rutube_ru:repeats=6
                   --new
                   --filter-tcp=80,443,8443
                   --ipset=$LISTS_DIR/ipset.list
                   --hostlist-exclude=$LISTS_DIR/exclude.list
                   --hostlist-exclude=$LISTS_DIR/exclude-extra.list
                   --ipset-exclude=$LISTS_DIR/ipset_exclude.list
                   --ipset-exclude=$LISTS_DIR/ipset_exclude-extra.list
                   --in-range=-s34228
                   --out-range=-s34228
                   --payload=all
                   --lua-desync=circular:key=ip:nld=2:fails=2:time=120:retrans=2:reset
                   --payload=tls_client_hello
                   --lua-desync=fake:blob=tls_clienthello_www_sferum_ru:repeats=6:tcp_ts=-600000:ip_id=zero:strategy=1
                   --lua-desync=multisplit:pos=2:strategy=1
                   --lua-desync=fake:blob=tls_clienthello_www_sferum_ru:repeats=8:tcp_ts=-600000:strategy=2
                   --lua-desync=multidisorder:pos=2:seqovl=661:seqovl_pattern=tls_clienthello_www_sferum_ru:strategy=2
                   --payload=http_req
                   --lua-desync=fake:blob=tls_clienthello_www_sferum_ru:repeats=8:tcp_ts=-600000:strategy=1
                   --lua-desync=http_domcase:strategy=1
                   --lua-desync=http_hostcase:spell=hoSt:strategy=1
                   --lua-desync=multisplit:pos=method+2,host+1:strategy=1
                   --lua-desync=fake:blob=tls_clienthello_sochi_park:repeats=6:tcp_ts=-600000:strategy=2"

# GAME FILTER выключен. Фрагменты — в game-profiles/circular.args.
# При включении диапазон 1024-65535 ставить ПОСЛЕ основных профилей
# и расширять TCP_PORTS / UDP_PORTS.

# IPv6 support
IPV6_ENABLED=0

# TCP ports for iptables rules
# .bat: --wf-tcp-in=80,443,2053,2083,2087,2096,8443[,GameFilterTCP]
TCP_PORTS=80,443,2053,2083,2087,2096,8443,853
# с game filter: TCP_PORTS=80,443,1024:65535

# UDP ports for iptables rules
# .bat: --wf-udp-in=443,19294-19344,50000-50100[,GameFilterUDP]
UDP_PORTS=443,19294:19344,50000:50100,853
# с game filter: UDP_PORTS=443,1024:65535

LOG_LEVEL=0
NFQUEUE_NUM=300
NFQWS_USER=root
