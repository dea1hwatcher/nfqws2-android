# Bypass WhatsApp and Telegram call blocking. Enabled via "Calls bypass" toggle
# and placed before the active strategy, making it strategy-independent.
#
# Calls are blocked by STUN signatures: the packets used to negotiate voice channels
# (bol-van/zapret #1668, #1693, #1908; ntc.party). A fake packet precedes each STUN
# packet — DPI inspects the fake first. WhatsApp relays: UDP 3478 & 3482; Telegram:
# 590–600 & 1400; WhatsApp signaling: TCP 5222 & TLS to whatsapp.net.
# @META@ and @TG@ are Meta and Telegram subnets defined in lib/common.sh.

# STUN to Meta and Telegram servers on any call port
--filter-udp=590-1400,3478-3482
--filter-l7=stun
--ipset-ip=@META@,@TG@
--out-range=-n12
--payload=stun
--lua-desync=fake:blob=calls_stun:repeats=6
--new
# STUN on standard STUN/TURN ports — direct calls and third-party TURN servers
--filter-udp=3478-3482
--filter-l7=stun
--out-range=-n12
--payload=stun
--lua-desync=fake:blob=calls_stun:repeats=6
--new
# Telegram call relays: custom protocol, not standard STUN
--filter-udp=590-600,1400
--filter-l7=unknown
--ipset-ip=@TG@
--out-range=-n4
--payload=unknown
--lua-desync=fake:blob=calls_stun:repeats=4
--new
# WhatsApp TLS signaling: SNI blocked by substring, split domain name
--filter-tcp=443
--filter-l7=tls
--hostlist-domains=whatsapp.net,whatsapp.com,wa.me,whatsapp.biz
--out-range=-d10
--payload=tls_client_hello
--lua-desync=multisplit:pos=1,midsld:seqovl=4:tcp_ts_up
--lua-desync=fake:blob=calls_tls:tcp_md5:tls_mod=rnd,dupsid,sni=ozon.ru:repeats=3
--new
# WhatsApp fallback chat and voice channel — TCP 5222 to Meta
--filter-tcp=5222
--ipset-ip=@META@
--out-range=-d10
--payload=all
--lua-desync=fake:blob=calls_tls:tcp_md5:tls_mod=rnd,dupsid,sni=ozon.ru:repeats=3
--lua-desync=multisplit:pos=1:seqovl=4:tcp_ts_up
