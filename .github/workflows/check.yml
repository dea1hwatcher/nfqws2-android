name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|=======$|>>>>>>>)' -- ':!*.bin' ':!binaries'; then
            echo "::error::conflict markers left in files — merge not fully resolved"
            exit 1
          fi

      - name: Shell script syntax (dash, same as sh on Android)
        run: |
          rc=0
          for f in service.sh action.sh customize.sh uninstall.sh lib/common.sh bin/nfqws2-ctl; do
            sh -n "$f" || { echo "::error file=$f::syntax error"; rc=1; }
          done
          exit $rc

      - name: Lua script syntax
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          rc=0
          for f in lua/*.lua; do
            luac -p "$f" || { echo "::error file=$f::lua syntax error"; rc=1; }
          done
          exit $rc

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regression suite (fast)
        run: sh tests/run.sh --fast

      - name: WebUI script syntax
        working-directory: webroot
        run: |
          rc=0
          for f in js/*.js; do
            node --check "$f" || { echo "::error file=webroot/$f::syntax error"; rc=1; }
          done
          cat js/*.js > /tmp/webui-all.js && node --check /tmp/webui-all.js || rc=1
          exit $rc

      - name: WebUI static checks & CSP
        run: node tests/webui/test_static.js

      - name: index.html references only existing files
        working-directory: webroot
        run: |
          rc=0
          for f in $(grep -oE '(src|href)="(js|css)/[^"]+"' index.html | sed -E 's/^(src|href)="//; s/"$//'); do
            [ -f "$f" ] || { echo "::error file=webroot/index.html::missing file $f"; rc=1; }
          done
          for f in js/*.js css/*.css; do
            grep -q "\"$f\"" index.html || { echo "::error file=webroot/$f::file not included in index.html"; rc=1; }
          done
          exit $rc

      - name: update.json and module.prop
        run: |
          jq -e '.version and .versionCode and .zipUrl and .changelog' update.json >/dev/null \
            || { echo "::error file=update.json::broken update.json"; exit 1; }
          grep -q '^updateJson=https://' module.prop \
            || { echo "::error file=module.prop::missing updateJson — the manager will not see updates"; exit 1; }
