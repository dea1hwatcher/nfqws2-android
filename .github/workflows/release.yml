name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release version, as in module.prop (for example v1.6.3)
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build-binaries:
    uses: ./.github/workflows/build-binaries.yml

  build-pkglist:
    uses: ./.github/workflows/build-pkglist.yml

  release:
    needs: [build-binaries, build-pkglist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: module.prop version matches the tag
        run: |
          ver=$(sed -n 's/^version=//p' module.prop | tr -d '\r')
          [ "$ver" = "$TAG" ] || { echo "::error::module.prop: version=$ver, tag is $TAG"; exit 1; }

      - name: Download built nfqws2 binaries
        uses: actions/download-artifact@v8
        with:
          pattern: nfqws2-*
          path: downloaded-binaries

      - name: Place built binaries into the module
        run: |
          for abi in android-arm android-arm64 android-x86 android-x86_64; do
            mkdir -p "binaries/$abi"
            cp -f "downloaded-binaries/nfqws2-$abi/nfqws2" "binaries/$abi/nfqws2"
            chmod 755 "binaries/$abi/nfqws2"
            ls -lh "binaries/$abi/nfqws2"
          done
          rm -rf downloaded-binaries

      - name: Download pkglist
        uses: actions/download-artifact@v8
        with:
          name: pkglist
          path: bin

      - name: Build zip
        run: |
          set -eu
          out="nfqws2-android-$TAG.zip"
          zip -q -r -9 -X "$out" \
            module.prop icon.png customize.sh service.sh action.sh boot-completed.sh uninstall.sh README.md LICENSE changelog.md \
            bin binaries blobs defaults lib lists lua strategies strategy-catalogs system webroot
          unzip -l "$out" | grep -Eq '[[:space:]]boot-completed\.sh$'
          unzip -l "$out" | grep -Eq '[[:space:]]system/bin/nfqws2-ctl$'
          unzip -l "$out" | tail -n 1
          echo "ZIP=$out" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
          LC_ALL: C.UTF-8
        run: |
          python3 -c "
          import sys, re
          text = open('changelog.md', encoding='utf-8').read()
          m = re.search(r'### [^\n]*' + re.escape(sys.argv[1]) + r':\s*([\s\S]*?)(?=### |\Z)', text)
          notes = m.group(1).strip() if m else text
          open('release-notes.md', 'w', encoding='utf-8').write(notes + '\n')
          " "$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -q '\.zip$'; then
              echo "zip already attached"
            else
              gh release upload "$TAG" "$ZIP"
            fi
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$ZIP" --title "$TAG" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi

      - name: Update update.json on main
        run: |
          set -eu
          git fetch origin main
          git checkout -B main origin/main
          code=$(git show "$GITHUB_SHA:module.prop" | sed -n 's/^versionCode=//p' | tr -d '\r')
          jq -n --arg v "$TAG" --argjson c "$code" \
                --arg z "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/$ZIP" \
                --arg l "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/changelog.md" \
                '{version: $v, versionCode: $c, zipUrl: $z, changelog: $l}' > update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet && exit 0
          git commit -m "update.json: $TAG"
          git push origin HEAD:main
